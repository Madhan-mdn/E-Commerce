<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<body>
        <header class="sticky top-0 left-0 w-full  bg-white z-50 py-[30px]">
            <div class="h-full flex items-center justify-between px-[100px]">
                <span class="font-bold text-[24px]">Ecommerce</span>
                <nav class="hidden md:flex items-center gap-[25px]">
                    <a href="index.html" class="text-[16px] text-black">Home</a>
                    <a href="products.html" class="text-[16px] text-gray-500 hover:text-black transition-colors duration-300">Products</a>
                    <a href="about.html" class="text-[16px] text-gray-500 hover:text-black transition-colors duration-300">About</a>
                    <a href="contact.html" class="text-[16px] text-gray-500 hover:text-black transition-colors duration-300">Contact</a>
                </nav>
                <div class="flex items-center gap-[15px]">

                    <a href="cart.html" class="p-2 border-2 border-gray-600 rounded-lg text-[14px] hover:text-white hover:bg-gray-700 transition-colors duration-300"><i class=" fa-solid fa-cart-shopping mr-2"></i>Cart (0)</a>

        <main class="px-[20px]">

                <img src="images/main.png.jpg" alt="banner.png" class="h-full w-full object-cover">

                <div class="absolute left-[100px] top-[200px] text-white ">
                    <h1 class="text-[40px]">New Season Arrivals</h1>
                    <p class="mt-[5px] text-[20px]">Discover the latest products and explore our new collection. Discover the latest products and explore our new collection</p>

        </main>
